<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Auditor v4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        
        .input-section, .output-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
        }
        
        .section-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .code-input {
            width: 100%;
            height: 300px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        .code-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .analyze-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .toggle {
            position: relative;
            width: 50px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle.active {
            background: #667eea;
        }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        
        .toggle.active::after {
            left: 28px;
        }
        
        .results {
            background: white;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e9ecef;
            min-height: 300px;
        }
        
        .vulnerability-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .vulnerable {
            background: #fee;
            color: #d63384;
            border: 1px solid #f5c2c7;
        }
        
        .safe {
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }
        
        .cwe-info {
            background: #fff3cd;
            border: 1px solid #ffecb5;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .cwe-title {
            font-weight: 600;
            color: #664d03;
            margin-bottom: 8px;
        }
        
        .secure-code {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #6c757d;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .status-bar {
            background: #e9ecef;
            padding: 10px 30px;
            font-size: 14px;
            color: #6c757d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
        }
        
        .status-dot.offline {
            background: #dc3545;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .analyze-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ AI Code Auditor v4</h1>
            <p>Security vulnerability detection powered by DeepSeek-Coder-6.7B + QLoRA</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div class="section-title">📝 Code Input</div>
                <textarea 
                    class="code-input" 
                    id="codeInput" 
                    placeholder="Paste your C/C++ code here for security analysis...

Example:
void copy_data(char* dest, char* src) {
    char buffer[256];
    strcpy(buffer, src);  // Potential buffer overflow
    strcpy(dest, buffer);
}"></textarea>
                
                <div class="controls">
                    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeCode()">
                        🔍 Analyze Code
                    </button>
                    
                    <div class="toggle-container">
                        <span>RAG Search:</span>
                        <div class="toggle" id="ragToggle" onclick="toggleRAG()"></div>
                    </div>
                </div>
            </div>
            
            <div class="output-section">
                <div class="section-title">📊 Analysis Results</div>
                <div class="results" id="results">
                    <div style="text-align: center; color: #6c757d; padding: 50px 20px;">
                        <div style="font-size: 48px; margin-bottom: 15px;">🤖</div>
                        <p>Enter code and click "Analyze Code" to get started</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Checking API status...</span>
            </div>
            <div>
                <span id="modelInfo">Model: DeepSeek-Coder-6.7B v4</span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:8000';  // Change to your FastAPI server
        let ragEnabled = false;
        
        // Check API health on load
        checkAPIHealth();
        
        async function checkAPIHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    const mode = data.model_loaded ? 'Live Model' : 'Demo Mode';
                    updateStatus(true, `API Ready • ${mode} • Patterns: ${data.vectorstore_count}`);
                } else {
                    updateStatus(false, 'API Error');
                }
            } catch (error) {
                updateStatus(false, 'API Offline — Run: python start_api.py');
            }
        }
        
        function updateStatus(online, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            dot.className = `status-dot ${online ? '' : 'offline'}`;
            text.textContent = message;
        }
        
        function toggleRAG() {
            ragEnabled = !ragEnabled;
            const toggle = document.getElementById('ragToggle');
            toggle.className = `toggle ${ragEnabled ? 'active' : ''}`;
        }
        
        async function analyzeCode() {
            const codeInput = document.getElementById('codeInput');
            const resultsDiv = document.getElementById('results');
            const analyzeBtn = document.getElementById('analyzeBtn');
            
            const code = codeInput.value.trim();
            if (!code) {
                alert('Please enter some code to analyze');
                return;
            }
            
            // Show loading state
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = '🔄 Analyzing...';
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Analyzing code for security vulnerabilities...</span>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/audit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        code: code,
                        use_rag: ragEnabled,
                        max_new_tokens: 300
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const result = await response.json();
                displayResults(result);
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <strong>❌ Analysis Failed</strong><br>
                        ${error.message}<br><br>
                        <small>Make sure the FastAPI server is running on ${API_BASE}</small>
                    </div>
                `;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '🔍 Analyze Code';
            }
        }
        
        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="vulnerability-badge ${result.is_vulnerable ? 'vulnerable' : 'safe'}">
                    ${result.is_vulnerable ? '⚠️ VULNERABLE' : '✅ SECURE'}
                </div>
            `;
            
            if (result.is_vulnerable && result.vulnerability) {
                const vuln = result.vulnerability;
                html += `
                    <div class="cwe-info">
                        <div class="cwe-title">${vuln.cwe_id}: ${vuln.cwe_name}</div>
                        <div><strong>Severity:</strong> ${vuln.severity}</div>
                        <div style="margin-top: 10px;">${vuln.explanation}</div>
                    </div>
                `;
            }
            
            if (result.secure_code) {
                html += `
                    <div>
                        <strong>🔒 Secure Code:</strong>
                        <div class="secure-code">${escapeHtml(result.secure_code)}</div>
                    </div>
                `;
            }
            
            if (result.fix_summary) {
                html += `
                    <div style="margin-top: 15px;">
                        <strong>🔧 Fix Summary:</strong><br>
                        ${result.fix_summary}
                    </div>
                `;
            }
            
            if (result.retrieved_patterns && result.retrieved_patterns.length > 0) {
                html += `
                    <div style="margin-top: 15px; font-size: 12px; color: #6c757d;">
                        <strong>📚 Related Patterns:</strong> ${result.retrieved_patterns.length} found
                    </div>
                `;
            }
            
            html += `
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #dee2e6; font-size: 12px; color: #6c757d;">
                    Model: ${result.model_used} • RAG: ${result.rag_enabled ? 'Enabled' : 'Disabled'}
                    ${result.demo_mode ? ' • <span style="color: #e67e22; font-weight:600;">Demo Mode — Real v4 Results</span>' : ''}
                </div>
            `;
            
            resultsDiv.innerHTML = html;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Allow Enter+Ctrl to analyze
        document.getElementById('codeInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeCode();
            }
        });
    </script>
</body>
</html>
